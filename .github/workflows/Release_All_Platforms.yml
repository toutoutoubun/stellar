name: Release All Platforms

# Unified release workflow — builds macOS / Windows / Linux in parallel
# and uploads all installers to a single GitHub Release.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0). Leave empty to build without release.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

# ── 共通: タグ名を1箇所で解決する ──
# push (tag) → github.ref_name  例: v0.3.2
# workflow_dispatch → inputs.tag_name  例: v0.3.2 (空なら release しない)
env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  # ============================================================
  # macOS — Universal (arm64 + x64) DMG
  # ============================================================
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Universal macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target universal-apple-darwin

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-macOS-universal-dmg
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # Windows — x64 MSI + NSIS
  # ============================================================
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Windows x64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc

      - name: Upload MSI (x64)
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Windows-x64-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 30

      - name: Upload NSIS installer (x64)
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Windows-x64-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # Linux — x86_64 deb + AppImage + RPM
  # ============================================================
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri (Linux x86_64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Linux-x86_64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Linux-x86_64-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 30

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Linux-x86_64-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: warn
          retention-days: 30

  # ============================================================
  # GitHub Release — collect all artifacts & publish
  # ============================================================
  publish-release:
    # tag push → RELEASE_TAG = "v0.3.2" (startsWith true)
    # workflow_dispatch + tag_name 入力あり → RELEASE_TAG = "v0.3.2" (startsWith true)
    # workflow_dispatch + tag_name 空 → RELEASE_TAG = "main" (startsWith false → skip)
    if: startsWith(needs.build-macos.result, 'success') && startsWith(needs.build-windows.result, 'success') && startsWith(needs.build-linux.result, 'success')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve_tag
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == v* ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      # workflow_dispatch で tag_name を指定した場合、そのタグが
      # まだ存在しなければ HEAD に作成する
      - name: Create tag if needed
        if: steps.resolve_tag.outputs.should_release == 'true'
        run: |
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created and pushed tag $TAG"
          else
            echo "Tag $TAG already exists"
          fi

      - name: Download all artifacts
        if: steps.resolve_tag.outputs.should_release == 'true'
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List downloaded artifacts
        if: steps.resolve_tag.outputs.should_release == 'true'
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        if: steps.resolve_tag.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          files: release-artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true

